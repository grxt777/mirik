<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StartupBase — энциклопедия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="ws">
        <span class="ws-icon">💼</span>
        <div><b>StartupBase</b><small>Мирик HQ</small></div>
      </div>
      <label class="search"><span>🔍</span><input id="q" type="search" placeholder="Поиск" autocomplete="off" /></label>
      <nav class="nav">
        <a href="/" class="nav-item">🏢 <span>Офис</span></a>
        <div class="nav-label">Энциклопедия</div>
        <button class="nav-item" data-nav="ideas">💡 <span>Все идеи</span><i id="nIdeas"></i></button>
        <button class="nav-item" data-nav="facts">📄 <span>Факты</span><i id="nFacts"></i></button>
        <div class="nav-label">Отрасли</div>
        <div id="sectorNav"></div>
      </nav>
      <button class="theme" id="theme" title="Тема">🌗 <span>Тема</span></button>
    </aside>

    <main class="main" id="main">
      <div class="topbar">
        <button class="burger" id="burger" aria-label="Меню">☰</button>
        <div class="crumbs" id="crumbs">StartupBase</div>
        <a class="top-link" href="/">← В офис</a>
      </div>
      <div class="cover"></div>
      <div class="page">
        <div class="page-icon" id="pageIcon">📚</div>
        <h1 id="pageTitle">Энциклопедия StartupBase</h1>
        <div class="callout" id="callout">
          <span>💡</span>
          <div>Каждая идея, которую оценивает совет (Артём, Дина, Камила, Бахтиёр), и каждый проверенный факт попадают сюда. Следующие исследования начинают с базы — быстрее и дешевле.</div>
        </div>
        <div class="stats" id="stats"></div>

        <div class="views" id="views">
          <button data-view="table" class="on">▦ Таблица</button>
          <button data-view="board">▤ Доска</button>
          <button data-view="facts">📄 Факты</button>
          <div class="view-tools">
            <select id="sort" title="Сортировка">
              <option value="updated">Сначала новые</option>
              <option value="score">По средней оценке</option>
              <option value="title">По названию</option>
            </select>
          </div>
        </div>
        <div id="content"><div class="empty">Загружаю…</div></div>
      </div>
    </main>

    <div class="peek-shade hidden" id="peekShade"></div>
    <aside class="peek hidden" id="peek" aria-label="Идея"></aside>
  </div>
  <script type="module" src="base.js"></script>
</body>
</html>
